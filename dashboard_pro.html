<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal Apik — Pro Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .card-header { background: #0d1117; border-bottom: 1px solid #30363d; font-weight: bold; }
        .badge-p1 { background: #f85149; }
        .badge-p2 { background: #d29922; }
        .badge-p3 { background: #58a6ff; }
        .badge-p4 { background: #3fb950; }
        .badge-p5 { background: #8b949e; }
        .stat-card { border-left: 4px solid #58a6ff; transition: 0.3s; }
        .stat-card:hover { background: #1c2333; }
        .output-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px; max-height: 400px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
        .output-box .key-highlight { color: #f0883e; }
        .output-box .string-highlight { color: #a5d6ff; }
        .output-box .number-highlight { color: #79c0ff; }
        .btn-copy { position: absolute; top: 10px; right: 10px; }
        .module-badge { cursor: pointer; transition: 0.2s; }
        .module-badge:hover { transform: scale(1.05); background: #30363d; }
        .c2-online { color: #3fb950; }
        .c2-offline { color: #f85149; }
        .list-group-item { background: #161b22; border-color: #30363d; color: #c9d1d9; }
        .nav-tabs .nav-link { color: #8b949e; }
        .nav-tabs .nav-link.active { background: #161b22; color: #c9d1d9; border-color: #30363d; }
        .tab-content { background: #161b22; border: 1px solid #30363d; border-top: none; border-radius: 0 0 12px 12px; padding: 15px; }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-light"><i class="bi bi-shield-lock-fill text-primary"></i> Arsenal Apik <span class="badge bg-secondary">v3.0</span></h1>
                <p class="text-secondary">Red Team Dashboard — 33 Custom Modules</p>
                <hr class="border-secondary">
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card stat-card p-3">
                    <h6 class="text-secondary"><i class="bi bi-grid-3x3-gap-fill"></i> Modules</h6>
                    <h2 class="text-light" id="totalModules">33</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3" style="border-left-color: #3fb950;">
                    <h6 class="text-secondary"><i class="bi bi-wifi"></i> C2 Beacons</h6>
                    <h2 class="text-light" id="beaconCount">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3" style="border-left-color: #d29922;">
                    <h6 class="text-secondary"><i class="bi bi-file-earmark-text"></i> Findings</h6>
                    <h2 class="text-light" id="findingsCount">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3" style="border-left-color: #f85149;">
                    <h6 class="text-secondary"><i class="bi bi-exclamation-triangle-fill"></i> Critical</h6>
                    <h2 class="text-light" id="criticalCount">0</h2>
                </div>
            </div>
        </div>

        <!-- Main -->
        <div class="row g-3">
            <!-- Left: Run Module -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-play-circle-fill text-success"></i> Run Module
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-2">
                            <select class="form-select bg-dark text-light border-secondary" id="moduleSelect">
                                <option value="subhunter">subhunter</option>
                                <option value="portprobe">portprobe</option>
                                <option value="fingerprint">fingerprint</option>
                                <option value="sqli">sqli</option>
                                <option value="xss">xss</option>
                                <option value="ssrf">ssrf</option>
                                <option value="ssti">ssti</option>
                                <option value="graphql">graphql</option>
                                <option value="deser">deser</option>
                                <option value="authbypass">authbypass</option>
                                <option value="chain">chain</option>
                                <option value="vulntrigger">vulntrigger</option>
                                <option value="misconfig">misconfig</option>
                                <option value="leakscan">leakscan</option>
                                <option value="bucketscan">bucketscan</option>
                                <option value="webfuzz">webfuzz</option>
                                <option value="apifuzz">apifuzz</option>
                                <option value="implant">implant</option>
                                <option value="beacon">beacon</option>
                                <option value="privesc">privesc</option>
                                <option value="lateral">lateral</option>
                                <option value="cleanup">cleanup</option>
                                <option value="persist">persist</option>
                                <option value="phishing">phishing</option>
                                <option value="exploit_payload">exploit_payload</option>
                                <option value="weaponize">weaponize</option>
                                <option value="diff">diff</option>
                                <option value="crash">crash</option>
                                <option value="mailcraft">mailcraft</option>
                                <option value="pretext">pretext</option>
                            </select>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="targetInput" placeholder="target" value="example.com">
                            <button class="btn btn-primary" onclick="runModule()"><i class="bi bi-play-fill"></i> Run</button>
                        </div>
                        <div class="progress mb-2" style="height: 4px;">
                            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
                        </div>
                        <div id="runOutput" class="output-box" style="max-height: 300px;">
                            <span class="text-secondary">Ready. Select module and target.</span>
                        </div>
                        <div class="mt-2 d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="copyOutput()"><i class="bi bi-clipboard"></i> Copy</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="downloadOutput()"><i class="bi bi-download"></i> Download JSON</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="clearOutput()"><i class="bi bi-x-circle"></i> Clear</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: C2 + Modules -->
            <div class="col-md-7">
                <!-- C2 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-hdd-network-fill text-info"></i> C2 Listener
                    </div>
                    <div class="card-body">
                        <div class="d-flex gap-2 mb-2">
                            <button class="btn btn-success btn-sm" onclick="startC2()"><i class="bi bi-play-fill"></i> Start</button>
                            <button class="btn btn-danger btn-sm" onclick="stopC2()"><i class="bi bi-stop-fill"></i> Stop</button>
                            <button class="btn btn-info btn-sm" onclick="refreshBeacons()"><i class="bi bi-arrow-repeat"></i> Refresh</button>
                        </div>
                        <div id="beaconList" style="max-height: 120px; overflow-y: auto; font-size: 12px;">
                            <span class="text-secondary">No beacons yet.</span>
                        </div>
                    </div>
                </div>

                <!-- Module Catalog -->
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-grid-3x3-gap-fill text-warning"></i> Module Catalog
                    </div>
                    <div class="card-body" style="max-height: 200px; overflow-y: auto;">
                        <div id="moduleList" class="d-flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lastOutput = '';

        async function runModule() {
            const module = document.getElementById('moduleSelect').value;
            const target = document.getElementById('targetInput').value;
            const output = document.getElementById('runOutput');
            const progress = document.getElementById('progressBar');
            
            output.innerHTML = '<span class="text-secondary">⏳ Running...</span>';
            progress.style.width = '20%';
            
            try {
                const res = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ module, target })
                });
                progress.style.width = '80%';
                const data = await res.json();
                progress.style.width = '100%';
                
                if (data.error) {
                    output.innerHTML = `<span class="text-danger">⚠️ Error: ${data.error}</span>`;
                } else {
                    lastOutput = JSON.stringify(data, null, 2);
                    output.innerHTML = `<pre class="text-light" style="margin:0;">${syntaxHighlight(lastOutput)}</pre>`;
                    updateFindings(data);
                }
            } catch (e) {
                progress.style.width = '100%';
                output.innerHTML = `<span class="text-danger">❌ Error: ${e.message}</span>`;
            }
            setTimeout(() => { progress.style.width = '0%'; }, 3000);
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(?:[^"\\]|\\.)*")(?=\s*:)/g, '<span class="key-highlight">$1</span>')
                       .replace(/: "([^"]*)"/g, ': <span class="string-highlight">"$1"</span>')
                       .replace(/: (\d+)/g, ': <span class="number-highlight">$1</span>');
        }

        function updateFindings(data) {
            const findings = document.getElementById('findingsCount');
            const critical = document.getElementById('criticalCount');
            let totalFindings = 0, totalCritical = 0;
            if (data && typeof data === 'object') {
                const json = JSON.stringify(data);
                const matches = json.match(/"priority":\s*"P[1-5]"/g) || [];
                totalFindings = matches.length;
                totalCritical = json.match(/"priority":\s*"P1"/g)?.length || 0;
            }
            findings.textContent = totalFindings;
            critical.textContent = totalCritical;
        }

        function copyOutput() {
            if (!lastOutput) return;
            navigator.clipboard.writeText(lastOutput).then(() => {
                alert('✅ Copied to clipboard!');
            });
        }

        function downloadOutput() {
            if (!lastOutput) return;
            const blob = new Blob([lastOutput], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'arsenal_output.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearOutput() {
            document.getElementById('runOutput').innerHTML = '<span class="text-secondary">Ready.</span>';
            lastOutput = '';
        }

        async function refreshBeacons() {
            const list = document.getElementById('beaconList');
            const count = document.getElementById('beaconCount');
            try {
                const res = await fetch('/api/beacons');
                const data = await res.json();
                count.textContent = Object.keys(data).length;
                if (Object.keys(data).length === 0) {
                    list.innerHTML = '<span class="text-secondary">No beacons yet.</span>';
                    return;
                }
                let html = '';
                for (const [id, info] of Object.entries(data)) {
                    const status = info.last_seen > Date.now()/1000 - 60 ? '🟢' : '🔴';
                    html += `<div class="text-light">${status} ${id} — ${info.info?.os || 'unknown'}</div>`;
                }
                list.innerHTML = html;
            } catch (e) {
                list.innerHTML = '<span class="text-danger">Error fetching beacons</span>';
            }
        }

        async function startC2() {
            const res = await fetch('/api/c2/start', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
        }

        async function stopC2() {
            const res = await fetch('/api/c2/stop', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
        }

        // Load modules
        fetch('/api/modules')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('moduleList');
                container.innerHTML = data.modules.map(m =>
                    `<span class="badge bg-dark border border-secondary module-badge" onclick="selectModule('${m}')">${m}</span>`
                ).join(' ');
            });

        function selectModule(name) {
            document.getElementById('moduleSelect').value = name;
        }

        refreshBeacons();
        setInterval(refreshBeacons, 5000);
    </script>
</body>
</html>
