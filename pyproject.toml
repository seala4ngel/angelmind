[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arsenal-apik"
version = "3.2.0"
description = "Custom security arsenal — 39 modules for red team and bug bounty"
authors = [{name = "seala4ngel"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "dnspython>=2.4.0",
    "fake-useragent>=1.5.0",
    "beautifulsoup4>=4.12.0",
    "colorama>=0.4.6",
    "flask>=3.0.0",
]
